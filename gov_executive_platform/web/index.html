<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- بدون هذا الوسم تعرض متصفحات الجوال (سفاري خاصةً) الصفحة بعرض سطح
       المكتب مصغّرة، فتبدو الخطوط دقيقة ولا تعمل نقاط التوقف الاستجابية. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E4D3C">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="المنصة التنفيذية لمتابعة مشاريع وزارة العدل — دولة الكويت">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="وزارة العدل — المنصة التنفيذية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>وزارة العدل — المنصة التنفيذية</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    تحميل محرك الرسم (CanvasKit) من ملفات المنصة نفسها لا من CDN خارجي.
    بدون هذا يجلبه Flutter من www.gstatic.com عند كل فتح (نحو ٧ ميغابايت)،
    وأي شبكة حكومية تحجب هذا النطاق تُظهر للمستخدم شاشة بيضاء فارغة بلا رسالة
    خطأ. التثبيت هنا يجعل السلوك صحيحاً حتى لو بُني المشروع بلا راية
    ‎--no-web-resources-cdn.
  -->
  <!--
    شاشة تحميل مبدئية + حارس إقلاع.

    سبب وجود الحارس: حزم Firebase تُحمَّل من www.gstatic.com أثناء تسجيل
    إضافات Flutter، أي **قبل** تنفيذ main() في Dart. فإذا حُجب النطاق أو
    انقطعت الشبكة لا يبدأ التطبيق أصلاً ولا يمكن التقاط العطل من داخل Dart،
    فيرى المستخدم صفحة بيضاء صامتة بلا أي تفسير. الحارس هنا مكتوب بجافاسكربت
    خالصة فيعمل مهما كان موضع التعليق.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #072E24; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; text-align: center;
      padding: 24px; box-sizing: border-box;
      /* أعلى قيمة ممكنة — وهذا سطر جوهري لا تجميلي:
         محرك Flutter يُلحق عنصره <flutter-view> بـ body وقت التشغيل، أي بعد
         هذه الشاشة في ترتيب المستند. وعنصران موضوعان بلا z-index يفوز آخرهما
         ترتيباً، فكان المحرك يغطّي شاشة الإقلاع بلوحة رسم شفافة فارغة قبل أن
         يرسم التطبيق شيئاً — فيرى المستخدم خلفية body الخضراء وحدها ويظن أن
         المنصة لا تفتح. قِيس ذلك على الجوال: العنصر في منتصف الشاشة كان
         flutter-view بينما #boot ما زال موجوداً وظاهراً خلفه. */
      z-index: 2147483647;
    }
    #boot .card { max-width: 460px; }
    #boot h1 { font-size: 17px; margin: 0 0 10px; font-weight: 800; }
    #boot p  { font-size: 13.5px; line-height: 1.9; color: rgba(255,255,255,.75); margin: 0 0 18px; }
    #boot button {
      background: #C9A227; color: #072E24; border: 0; border-radius: 8px;
      padding: 11px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
      font-family: inherit;
    }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.22); border-top-color: #C9A227;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="boot">
    <div class="card">
      <div class="spinner" id="boot-spinner"></div>
      <h1 id="boot-title">جارٍ تحميل المنصة… <span id="boot-elapsed" style="opacity:.6;font-weight:600"></span></h1>
      <p id="boot-msg">وزارة العدل — دولة الكويت</p>
      <button id="boot-retry" style="display:none" onclick="location.reload()">إعادة المحاولة</button>
      <button id="boot-skip" style="display:none;background:transparent;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.3);margin-inline-start:8px" onclick="hideBoot()">المتابعة على أي حال</button>
    </div>
  </div>


  <script>
    // مقصود: يُحمَّل المُقلِع كملف خارجي ولا يُدرَج محتواه هنا.
    //
    // إدراج محتواه عبر رموز القوالب (flutter_js / flutter_build_config)
    // يضع بصمة إصدار
    // التطبيق (engineRevision) داخل هذا الملف، فتُجمَّد النسخة كاملةً في أي
    // متصفح يخزّن index.html — وهو ما جعل سفاري يعرض النسخة القديمة بعد
    // النشر. إبقاؤه ملفاً خارجياً (وهو no-cache في firebase.json) يضمن جلب
    // أحدث إصدار دائماً حتى لو كانت نسخة index.html مخزّنة.
    //
    // مسار CanvasKit المحلي يُضبط عبر راية البناء --no-web-resources-cdn،
    // انظر tool/build_web.sh.

    function hideBoot() {
      clearTimeout(bootTimer);
      clearInterval(bootTick);
      if (bootObserver) bootObserver.disconnect();
      var el = document.getElementById('boot');
      if (el) el.remove();
    }

    // من يُخفي هذه الشاشة؟ **التطبيق نفسه** عبر هذه الدالة، لا حدث من المحرك.
    //
    // كان الإخفاء مربوطاً بـ flutter-first-frame، وهو حدث يُطلقه المحرك عند
    // أول إطار **ولو كان المشهد فارغاً تماماً**. فكان يُخفي الشاشة قبل أن
    // يرسم التطبيق أي واجهة حقيقية. الآن يستدعي Dart هذه الدالة بعد أول بناء
    // فعلي لجذر التطبيق (راجع lib/boot_signal.dart)، فالإخفاء يعني حرفياً
    // "ظهرت واجهة يراها المستخدم".
    window.platformUiReady = hideBoot;

    // ظهور flutter-view يُحدّث النص فقط ليعرف المستخدم أن التقدّم مستمر.
    // ولا يفعل ذلك بعد انقضاء المهلة: المحرك قد يُنشئ عنصره متأخراً فيمسح
    // رسالة الحارس التي تشرح سبب العطل، ويبقى المستخدم بلا تفسير.
    var bootFailed = false;
    var bootObserver = new MutationObserver(function () {
      if (!document.querySelector('flutter-view')) return;
      bootObserver.disconnect();
      if (bootFailed) return;
      var msg = document.getElementById('boot-msg');
      if (msg) msg.textContent = 'جارٍ الاتصال بخدمات المنصة…';
    });
    bootObserver.observe(document.documentElement, { childList: true, subtree: true });

    // عدّاد ثوانٍ حيّ: شاشة ساكنة تبدو متجمّدة، ورقم يتحرّك يطمئن المستخدم أن
    // العمل جارٍ ويعطينا رقماً يذكره عند الإبلاغ عن أي عطل.
    var bootStarted = Date.now();
    var bootTick = setInterval(function () {
      var el = document.getElementById('boot-elapsed');
      if (el) el.textContent = '(' + Math.round((Date.now() - bootStarted) / 1000) + ' ث)';
    }, 1000);

    // إن لم تظهر واجهة خلال ١٢ ثانية نعرض سبباً مفهوماً بدل الانتظار الصامت،
    // مع مخرج يدوي حتى لا يُحبس المستخدم خلف الشاشة لو كان التطبيق يعمل فعلاً.
    var bootTimer = setTimeout(function () {
      bootFailed = true;
      clearInterval(bootTick);
      document.getElementById('boot-spinner').style.display = 'none';
      document.getElementById('boot-elapsed').textContent = '';
      document.getElementById('boot-title').textContent = 'يستغرق التحميل وقتاً أطول من المعتاد';
      document.getElementById('boot-msg').innerHTML =
        'إن استمر ذلك فتأكد من اتصال الشبكة، وإن كنت داخل شبكة الوزارة فقد يكون ' +
        'الوصول إلى النطاق <strong>www.gstatic.com</strong> محجوباً — يلزم السماح ' +
        'به لتشغيل المنصة.';
      document.getElementById('boot-retry').style.display = 'inline-block';
      document.getElementById('boot-skip').style.display = 'inline-block';
    }, 12000);
  </script>

  <!--
    تحميل حزم Firebase من المنصة نفسها بدل www.gstatic.com.

    إضافة firebase_core_web تحقن أربعة سكربتات من ذلك النطاق وقت التشغيل وقبل
    أن يُرسم أي شيء، فإن حجبته الشبكة أو أبطأته تعلّقت المنصة قبل ظهورها. لكن
    الإضافة تتخطّى الحقن كاملاً إن وجدت window.firebase_core مضبوطاً مسبقاً
    (راجع firebase_core_web/lib/src/firebase_core_web.dart: إن لم يكن
    firebase_core فارغاً عادت الدالة فوراً). فنضبطه هنا من ملفات محلية.

    الملفات يجلبها tool/fetch_firebase_sdk.sh وقت البناء. وإن غابت — أو فشل
    استيرادها لأي سبب — لا يحدث شيء وتعمل المنصة بمسارها الحالي تماماً. أي
    أن أسوأ الاحتمالات هو سلوك اليوم نفسه، لا انحدار.
  -->
  <script type="module">
    // إقلاع Flutter يبدأ من هنا **بعد** محاولة ضبط الحزم المحلية، لا بوسم
    // مستقل: لو تُرك وسماً مستقلاً لتسابق التحميلان، وقد يسأل التطبيق عن
    // window.firebase_core قبل أن يُضبط فيعود لجلبه من الشبكة أحياناً وأحياناً
    // لا — وهو أسوأ من عطل ثابت لأنه يظهر ويختفي.
    (async () => {
      try {
        const [core, auth, firestore, functions] = await Promise.all([
          import('./firebase_sdk/firebase-app.js'),
          import('./firebase_sdk/firebase-auth.js'),
          import('./firebase_sdk/firebase-firestore.js'),
          import('./firebase_sdk/firebase-functions.js'),
        ]);
        // الأسماء الأربعة مطلوبة كلها: الفحص يقع على firebase_core وحده، فلو
        // ضبطناه دون البقية لتخطّت الإضافة حقن الثلاثة الأخرى وفشل التطبيق.
        window.firebase_core = core;
        window.firebase_auth = auth;
        window.firebase_firestore = firestore;
        window.firebase_functions = functions;
      } catch (e) {
        // لا شيء: تعود الإضافة لجلب الحزم من الشبكة كما كانت.
        console.info('حزم Firebase المحلية غير متوفرة، سيُعتمد على المصدر الافتراضي.', e);
      } finally {
        // في finally لا في try: مهما فشل ما سبق يجب أن يُقلع التطبيق.
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
    })();
  </script>
  <!-- متصفح لا يفهم الوحدات (module) يتخطّى ما سبق، فيُقلع من هنا. -->
  <script nomodule src="flutter_bootstrap.js" async></script>
</body>
</html>
